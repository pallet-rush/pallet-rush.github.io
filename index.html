<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5cb8f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pallet Rush">
<title>Pallet Rush</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- Spiel-HUD -->
<div id="hud" class="hidden">
  <button id="btn-pause" class="icon-btn" aria-label="Menü">☰</button>
  <div class="hud-center">
    <div id="hud-level" class="hud-level">Level 1</div>
  </div>
  <div class="coins"><span class="coin"></span><span id="hud-coins">0</span></div>
  <button id="btn-restart" class="icon-btn" aria-label="Neu starten">↻</button>
</div>
<div id="warn" class="warn hidden"></div>
<div id="toast" class="toast hidden"></div>

<div id="boosters" class="hidden">
  <button class="booster" data-b="ramp"><span class="b-icon">⊞</span><span class="b-name" data-i18n="booster_ramp"></span><span class="b-count"></span></button>
  <button class="booster" data-b="shuffle"><span class="b-icon">⇄</span><span class="b-name" data-i18n="booster_shuffle"></span><span class="b-count"></span></button>
  <button class="booster" data-b="crane"><span class="b-icon">⤒</span><span class="b-name" data-i18n="booster_crane"></span><span class="b-count"></span></button>
  <button class="booster" data-b="forklift"><span class="b-icon">⇶</span><span class="b-name" data-i18n="booster_forklift"></span><span class="b-count"></span></button>
</div>

<!-- Hauptmenü -->
<div id="menu" class="screen">
  <div class="menu-top">
    <div class="coins big"><span class="coin"></span><span id="menu-coins">0</span></div>
  </div>
  <div class="logo">
    <div class="logo-truck">
      <span class="lt-cargo"></span><span class="lt-cab"></span>
    </div>
    <h1>Pallet<br>Rush</h1>
  </div>
  <div class="menu-buttons">
    <button id="btn-play" class="btn primary big"><span data-i18n="play"></span><small id="play-level">Level 1</small></button>
    <button id="btn-levels" class="btn" data-i18n="levels"></button>
    <button id="btn-settings" class="btn" data-i18n="settings"></button>
  </div>
  <div class="menu-foot">
    <div data-i18n="credit"></div>
    <div id="version" class="version"></div>
  </div>
</div>

<!-- Dialog -->
<div id="modal" class="modal hidden">
  <div class="panel" id="modal-panel"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
